include:
  - project: 'kmila-9s/ci-templates'
    file: '/auto-merge.yml'
  - project: 'kmila-9s/ci-templates'
    file: '/release.yml'
  - project: 'kmila-9s/ci-templates'
    file: '/commit-guard.yml'
  - project: 'kmila-9s/ci-templates'
    file: '/downstream-fanout.yml'

stages:
  - test
  - merge
  - release
  - fanout
unit-test:
    stage: test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    script:
      - dotnet --info
      - dotnet workload install maui-android
      # Parser is a library (v3.0.1): its tests live in Tests/Unit/Kmila.Engine.Tests.
      - dotnet build -f net10.0 -c Release