include:
  - project: 'kmila-9s/ci-templates'
    file: '/auto-merge.yml'
  - project: 'kmila-9s/ci-templates'
    file: '/downstream-fanout.yml'

stages:
  - test
  - merge
  - fanout
unit-test:
    stage: test
    image: mcr.microsoft.com/dotnet/sdk:9.0
    script:
      - dotnet --info
      - dotnet workload install maui-android
      - dotnet run -f net9.0